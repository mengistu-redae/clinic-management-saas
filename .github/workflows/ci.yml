name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One in-flight run per branch/PR; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spring-boot-api:
    name: spring-boot-api (mvn verify)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # ubuntu-latest ships a working Docker daemon, so the Testcontainers
    # Postgres + Redis in AbstractIntegrationTest come up for real here.
    defaults:
      run:
        working-directory: spring-boot-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: mvn verify
        run: mvn -B --no-transfer-progress verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: spring-boot-api/target/surefire-reports/
          if-no-files-found: ignore

  node-bff:
    name: node-bff (npm test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-bff
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: node-bff/package-lock.json

      - run: npm ci
      - run: npm test

  frontend:
    name: frontend (vitest + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node-bff/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: node-bff/frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
