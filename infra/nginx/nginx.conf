events {
  worker_connections 1024;
}

http {
  # Route everything to the Node.js BFF by default - the browser never talks
  # to Keycloak or the Spring Boot API directly. The BFF holds the session
  # and forwards bearer tokens to the API on the server side.
  upstream bff {
    server node-bff:3000;
  }

  # Exposed only for local development so you can reach the Keycloak admin
  # console at /keycloak/ - remove or lock this down before going further
  # than a single-VM pilot.
  upstream keycloak {
    server keycloak:8080;
  }

  server {
    listen 80;

    location /keycloak/ {
      proxy_pass http://keycloak/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://bff;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cookie_path / /;
    }
  }
}
