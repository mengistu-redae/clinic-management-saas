version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinicops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinicops}
      POSTGRES_MULTIPLE_DATABASES: clinic_management,keycloak
    volumes:
      - ./infra/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinicops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-clinicops}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-clinicops}
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  spring-boot-api:
    build: ./spring-boot-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clinic_management
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-clinicops}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-clinicops}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/clinic
      # The `iss` value tokens actually carry (see JwtDecoderConfig's
      # javadoc) - the host the browser used to reach Keycloak's authorize
      # endpoint, published by docker-compose, different from the internal
      # container-to-container URL above.
      KEYCLOAK_ISSUER_PUBLIC_URI: http://localhost:8080/realms/clinic
      # For PlatformController's "create clinic" endpoint (platform_admin,
      # phase 6) - calls Keycloak's Admin REST API directly, reusing the same
      # admin credentials the keycloak service itself is seeded with above.
      KEYCLOAK_ADMIN_BASE_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      # Spring Boot's resource-server autoconfig resolves the JWK set lazily
      # on first request, not at startup, so this doesn't depend on Keycloak
      # being ready yet - only on the app itself (DB migrated, context up).
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  node-bff:
    build: ./node-bff
    environment:
      PORT: 3000
      API_BASE_URL: http://spring-boot-api:8081
      REDIS_URL: redis://redis:6379
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/clinic
      KEYCLOAK_ISSUER_PUBLIC: http://localhost:8080/realms/clinic
      KEYCLOAK_CLIENT_ID: clinic-bff
      KEYCLOAK_CLIENT_SECRET: ${BFF_CLIENT_SECRET:-changeme-in-keycloak-console}
      SESSION_SECRET: ${SESSION_SECRET:-changeme-long-random-string}
      BFF_BASE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      spring-boot-api:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Not service_healthy - Keycloak has no healthcheck defined here, and
      # node-bff's own OIDC discovery already retries with backoff (see
      # src/auth/oidc.js) to cover the gap between "container started" and
      # "realm import finished".
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  nginx:
    image: nginx:alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      node-bff:
        condition: service_healthy
      keycloak:
        condition: service_started

volumes:
  postgres_data:
